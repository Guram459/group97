<!-- 
Dimensions ნიშნავს ელემენტის ზომებს — სიგანეს (width) და სიმაღლეს (height).
მისი გაზომვისთვის გამოიყენება სხვადასხვა ერთეულები.

მთავარი ერთეულებია:
1. px (პიქსელი) — ფიქსირებული ზომა ekranzis ერთეულით.
2. % (პროცენტი) — ზომა დამოკიდებულია მშობელ ელემენტზე.
3. em — დამოკიდებულია ელემენტის ან მშობელის შრიფტის ზომაზე.
4. rem — დამოკიდებულია root ელემენტის (html) შრიფტის ზომაზე.
5. vw / vh — Viewport Width / Height — ფანჯრის სიგანისა და სიმაღლის პროცენტულად აღება.
-->
